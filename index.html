<style>
/* Layout concept: a quiet two-pane desktop app. Slim sidebar, one reading column.
   Serif display for titles and dates, grotesk for UI, mono for numbers and dates. */
:root {
  --bg: #0e1013;
  --surface: #14171c;
  --surface-2: #1a1e24;
  --surface-3: #21262d;
  --line: #242a32;
  --line-strong: #323a45;
  --fg: #e9e7e2;
  --fg-2: #a6aab1;
  --fg-3: #6f757e;
  --accent: #d9a86c;
  --accent-ink: #1b1409;
  --accent-soft: rgba(217, 168, 108, 0.12);
  --accent-line: rgba(217, 168, 108, 0.38);
  --good: #8dbf9a;
  --good-soft: rgba(141, 191, 154, 0.13);
  --late: #e3958a;
  --late-soft: rgba(227, 149, 138, 0.12);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --scrim: rgba(5, 6, 8, 0.62);
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 0.7, 0.2, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f7f8f9;
  --surface-3: #eceef1;
  --line: #e2e5e9;
  --line-strong: #cfd4da;
  --fg: #16181c;
  --fg-2: #50555d;
  --fg-3: #858a92;
  --accent: #99600f;
  --accent-ink: #ffffff;
  --accent-soft: rgba(153, 96, 15, 0.09);
  --accent-line: rgba(153, 96, 15, 0.35);
  --good: #3b7d52;
  --good-soft: rgba(59, 125, 82, 0.11);
  --late: #b4483a;
  --late-soft: rgba(180, 72, 58, 0.09);
  --shadow: 0 10px 30px rgba(20, 24, 30, 0.14);
  --scrim: rgba(20, 24, 30, 0.35);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.ico { flex: none; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
.side {
  display: flex; flex-direction: column; gap: 4px;
  padding-block: 20px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 12px;
  border-right: 1px solid var(--line);
  background: var(--bg);
  min-height: 0;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 2px 8px 18px; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 25px; letter-spacing: 0.01em; }
.brand span { font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 8px; border-radius: 6px; color: var(--fg-2); text-align: left;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item.on { background: var(--surface-3); color: var(--fg); }
.nav-item .n { margin-left: auto; font-family: var(--f-mono); font-size: 11.5px; color: var(--fg-3); }
.side-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.capture-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: 6px; background: var(--accent); color: var(--accent-ink);
  font-weight: 500; margin-bottom: 14px;
}
.capture-btn:hover { filter: brightness(1.06); }
.capture-btn kbd { margin-left: auto; background: rgba(0, 0, 0, 0.14); color: inherit; border-color: transparent; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.sync { width: 100%; text-align: left; cursor: pointer; border-radius: 6px; }
.sync:hover { background: var(--surface-2); }
.sync { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: var(--fg-3); font-size: 12px; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
.sync[data-s="saving"] i { background: var(--accent); }
.sync[data-s="error"] i { background: var(--late); }
.sync[data-s="error"] { color: var(--late); }

.main { overflow: auto; min-width: 0; min-height: 0; scroll-behavior: auto; }
.view {
  max-width: 1080px; margin: 0 auto;
  padding-block: 36px 96px;
  padding-left: clamp(16px, 4vw, 44px);
  padding-right: max(clamp(16px, 4vw, 44px), env(safe-area-inset-right, 0px));
}
.topbar, .tabbar, .fab { display: none; }

/* ---------- type ---------- */
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
h1, h2, h3, h4 { margin: 0; font-weight: 500; text-wrap: balance; }
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: 0.005em; line-height: 1.05; }
h1.display { font-size: 46px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head h1 { font-size: 40px; }
.sec-title { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
.sec-title .n { font-family: var(--f-mono); letter-spacing: 0; }
.sec-title .sp { margin-left: auto; text-transform: none; letter-spacing: 0; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 6px;
  border: 1px solid var(--line-strong); color: var(--fg); background: transparent; white-space: nowrap;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { background: var(--surface-2); border-color: var(--fg-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--late); border-color: var(--late-soft); }
.btn.danger:hover { background: var(--late-soft); border-color: var(--late); }
.btn.quiet { border-color: transparent; color: var(--fg-2); }
.btn.quiet:hover { background: var(--surface-2); color: var(--fg); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--fg-3);
  transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--fg); }
kbd {
  font-family: var(--f-mono); font-size: 11px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line-strong); color: var(--fg-3); background: var(--surface-2);
}
.field {
  width: 100%; padding: 8px 10px; border-radius: 6px; background: var(--surface-2);
  border: 1px solid var(--line); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
.field:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.field::placeholder, .ghost-in::placeholder, .stitle::placeholder { color: var(--fg-3); }
textarea.field { resize: vertical; min-height: 64px; line-height: 1.5; }
select.field { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="date"] { color-scheme: inherit; }
.ghost-in { background: transparent; border: 0; outline: none; width: 100%; padding: 0; }
label.lab { display: block; font-size: 12px; color: var(--fg-3); margin-bottom: 5px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; }
.seg button { padding: 3px 11px; border-radius: 5px; color: var(--fg-2); font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--surface-3); color: var(--fg); }
.seg .n { font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); margin-left: 5px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px;
  font-family: var(--f-mono); font-size: 11.5px; line-height: 18px; color: var(--fg-2);
  border: 1px solid var(--line-strong); white-space: nowrap; max-width: 100%;
}
.chip.tag { border-style: dashed; }
.chip.late { color: var(--late); border-color: transparent; background: var(--late-soft); }
.chip.soon { color: var(--accent); border-color: transparent; background: var(--accent-soft); }
.chip.done { color: var(--good); border-color: transparent; background: var(--good-soft); }
.chip.ready { color: var(--good); border-color: var(--good-soft); background: var(--good-soft); font-family: var(--f-ui); }
.chip.pri-high { color: var(--accent); border-color: var(--accent-line); }
button.chip:hover { border-color: var(--fg-3); color: var(--fg); }

.bar { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.7s var(--ease); }
.bar.full i { background: var(--good); }
.bar.lg { height: 6px; border-radius: 3px; }
.bar.sm { height: 3px; }

/* checkbox */
.cb {
  width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-strong); flex: none;
  display: inline-grid; place-items: center; color: transparent; background: transparent;
  transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.18s var(--ease);
}
.cb:hover { border-color: var(--accent); }
.cb:active { transform: scale(0.9); }
.cb.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cb.part { border-color: var(--accent); color: var(--accent); }
.cb.part::after { content: ""; width: 8px; height: 2px; border-radius: 1px; background: var(--accent); }

/* ---------- home ---------- */
.home-head { margin-bottom: 22px; }
.home-head h1 span { color: var(--fg-3); font-style: italic; }
.capture {
  display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 14px; margin-bottom: 32px;
  border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.capture:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.capture input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 9px 0; font-size: 15px; }
.capture input::placeholder { color: var(--fg-3); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
.home-side { display: flex; flex-direction: column; gap: 32px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pcard {
  display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 8px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); min-width: 0;
  transition: border-color 0.15s, transform 0.2s var(--ease), background 0.15s;
}
.pcard:hover { border-color: var(--line-strong); background: var(--surface-2); }
.pc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.pc-top h3 { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
.pc-prog { display: flex; align-items: center; gap: 12px; }
.pc-prog .bar { flex: 1; }
.pc-prog b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; min-width: 38px; text-align: right; }
.pc-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--fg-3); }
.pc-next { display: flex; align-items: flex-start; gap: 9px; padding-top: 12px; border-top: 1px solid var(--line); min-width: 0; }
.pc-next .cb { margin-top: 1px; }
.pc-next span { min-width: 0; overflow-wrap: anywhere; color: var(--fg-2); }
.pc-next small { display: block; font-size: 11.5px; color: var(--fg-3); }
.paused-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.pill-link {
  display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; border-radius: 6px;
  border: 1px solid var(--line); color: var(--fg-2); max-width: 100%;
}
.pill-link:hover { border-color: var(--line-strong); color: var(--fg); }
.pill-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.list { display: flex; flex-direction: column; }
.li {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; margin-inline: -6px; border-radius: 6px; min-width: 0;
  transition: background 0.15s;
}
.li:hover { background: var(--surface-2); }
.li .cb { margin-top: 2px; }
.li .body { flex: 1; min-width: 0; }
.li .t { overflow-wrap: anywhere; }
.li .s { font-size: 12px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li.done .t { color: var(--fg-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.li .x { opacity: 0; }
.li:hover .x, .li:focus-within .x { opacity: 1; }
.li .when { font-family: var(--f-mono); font-size: 11.5px; color: var(--fg-3); white-space: nowrap; padding-top: 2px; text-align: right; }
.li .when.late { color: var(--late); }
.li .when.soon { color: var(--accent); }
.li a.go { color: inherit; }
.li button.body { text-align: left; }
.grp { font-size: 11.5px; color: var(--fg-3); margin: 14px 0 2px; }
.grp.late { color: var(--late); }
.empty { padding: 22px 18px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--fg-2); }
.empty b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--fg); margin-bottom: 4px; }
.empty.flush { border: 0; padding: 12px 0; }
.empty .btn { margin-top: 12px; }
.note-mini { padding: 9px 0; border-top: 1px solid var(--line); }
.note-mini:first-of-type { border-top: 0; }
.note-mini p { margin: 0; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.note-mini .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--fg-3); }

/* ---------- projects list ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .grow { flex: 1; min-width: 180px; position: relative; }
.toolbar .grow .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.toolbar .grow .field { padding-left: 32px; }
.toolbar select.field { width: auto; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.prow {
  display: grid; grid-template-columns: minmax(0, 1fr) 150px 120px; align-items: center; gap: 20px;
  padding: 14px 6px; margin-inline: -6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px;
}
.prow:hover { background: var(--surface-2); }
.prow .nm { font-family: var(--f-display); font-size: 21px; line-height: 1.2; overflow-wrap: anywhere; }
.prow .ds { color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.prow .mt { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.prow .pg { display: flex; align-items: center; gap: 10px; }
.prow .pg .bar { flex: 1; }
.prow .pg b { font-family: var(--f-mono); font-weight: 500; font-size: 12.5px; min-width: 34px; text-align: right; }
.prow .st { text-align: right; font-family: var(--f-mono); font-size: 12px; color: var(--fg-3); }

/* ---------- project page ---------- */
.crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); margin-bottom: 18px; }
.crumb:hover { color: var(--fg); text-decoration: none; }
.ph-top { display: flex; align-items: flex-start; gap: 14px; }
.p-title {
  flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 0; resize: none; overflow: hidden;
  font-family: var(--f-display); font-size: 44px; line-height: 1.08; color: var(--fg); letter-spacing: 0.005em;
}
.p-title::placeholder { color: var(--fg-3); }
.p-title:focus { box-shadow: 0 1px 0 var(--accent-line); }
.p-desc { width: 100%; background: none; border: 0; outline: none; resize: none; padding: 0; margin-top: 8px; color: var(--fg-2); font-size: 15px; line-height: 1.55; overflow: hidden; }
.p-desc::placeholder { color: var(--fg-3); }
.p-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.mf {
  display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; border-radius: 6px;
  border: 1px solid var(--line); color: var(--fg-2); font-size: 13px; background: transparent; position: relative;
}
.mf:hover { border-color: var(--line-strong); color: var(--fg); }
.mf input, .mf select {
  background: none; border: 0; outline: none; color: inherit; padding: 0; width: 7.2em; font-family: var(--f-mono); font-size: 12.5px;
}
.mf select { font-family: var(--f-ui); font-size: 13px; width: auto; appearance: none; cursor: pointer; }
.mf input.tg { width: 9ch; font-family: var(--f-ui); font-size: 13px; }
.mf input[type="date"] { width: 8.8em; }
.mf.late { color: var(--late); border-color: var(--late-soft); background: var(--late-soft); }
.status-btn { font-weight: 500; }
.status-btn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.status-btn[data-st="paused"]::before { background: var(--fg-3); }
.status-btn[data-st="completed"]::before { background: var(--good); }
.status-btn[data-st="archived"]::before { background: var(--line-strong); }
.prog-block { margin: 28px 0 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 24px; align-items: center; }
.prog-block .big { font-family: var(--f-display); font-size: 64px; line-height: 0.95; grid-row: span 2; }
.prog-block .big small { font-size: 26px; color: var(--fg-3); margin-left: 2px; }
.prog-block .lines { display: flex; flex-direction: column; gap: 10px; }
.prog-block .counts { font-family: var(--f-mono); font-size: 12.5px; color: var(--fg-3); display: flex; gap: 14px; flex-wrap: wrap; }
.prog-note { font-size: 12.5px; color: var(--fg-3); margin: 0 0 24px; }
.banner {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; margin: 16px 0 4px; border-radius: 8px;
  background: var(--good-soft); border: 1px solid var(--good-soft); color: var(--fg);
}
.banner .grow { flex: 1; min-width: 200px; }
.banner b { font-weight: 500; }
.banner.info { background: var(--surface-2); border-color: var(--line); }
.steps-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 28px 0 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.steps-head h2 { font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-3); margin-right: auto; }
.steps-head .field { width: 190px; padding: 4px 9px; font-size: 13px; }

/* steps */
.steps { display: flex; flex-direction: column; padding-left: 22px; }
.step { position: relative; }
.kids { margin-left: 25px; border-left: 1px solid var(--line); padding-left: 0; }
.srow {

<script>
(function () {
'use strict';
/* ===================== utils ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mkid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ds(new Date());
const pd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const diff = (a, b) => Math.round((pd(a) - pd(b)) / 864e5);
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const short = s => {
  const d = pd(s); if (!d) return '';
  let t = d.getDate() + ' ' + MON[d.getMonth()];
  if (d.getFullYear() !== new Date().getFullYear()) t += ' ' + d.getFullYear();
  return t;
};
const shortDow = s => { const d = pd(s); return d ? DOW[d.getDay()] + ' ' + short(s) : ''; };
const rel = s => {
  const n = diff(s, today());
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  if (n > 1) return n <= 14 ? 'in ' + n + ' days' : '';
  return -n + ' days ago';
};
const ago = ts => {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24);
  if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
  return short(ds(new Date(ts)));
};
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const monday = s => { const d = pd(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ds(d); };
const normTag = t => String(t || '').trim().replace(/^#+/, '').toLowerCase().replace(/\s+/g, '-').slice(0, 24);
const safeUrl = u => {
  u = String(u || '').trim(); if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) && x.hostname.includes('.') ? x.href : ''; } catch (e) { return ''; }
};
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ===================== icons ===================== */
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>',
  grip: '<g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g>',
  more: '<g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></g>',
  home: '<path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/>',
  folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  inbox: '<path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  link: '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  note: '<path d="M6 4h12v16H6zM9 9h6M9 13h6M9 17h3"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  undo: '<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',
  pen: '<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>',
  moon: '<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  indent: '<path d="M4 6h16M12 12h8M4 18h16M4 9l3 3-3 3"/>',
  outdent: '<path d="M4 6h16M12 12h8M4 18h16M7 9l-3 3 3 3"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  upload: '<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',
  keys: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  sync: '<path d="M4 12a8 8 0 0113.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 01-13.7 5.6L4 15M4 20v-5h5"/>',
  restore: '<path d="M4 4v6h6M4.5 15a8 8 0 100-6"/>'
};
const ico = (n, s = 16) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n] || ''}</svg>`;

/* ===================== data model ===================== */
const MAXD = 4;
const STATUS = ['active', 'paused', 'completed', 'archived'];
const STATUS_LABEL = { active: 'Active', paused: 'Paused', completed: 'Completed', archived: 'Archived' };
const PRI = { high: 3, med: 2, low: 1, '': 0 };
const PRI_LABEL = { high: 'High', med: 'Medium', low: 'Low' };

const S = { projects: {}, notes: {}, meta: { focus: [], theme: 'dark' } };

const str = (v, max = 5000) => typeof v === 'string' ? v.slice(0, max) : '';
const dstr = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && pd(v)) ? v : '';
const okId = v => typeof v === 'string' && /^[A-Za-z0-9_-]{3,60}$/.test(v);

function cleanStep(x, depth, seen) {
  if (!x || typeof x !== 'object') return null;
  let id = okId(x.id) ? x.id : mkid('s');
  if (seen.has(id)) id = mkid('s');
  seen.add(id);
  const s = {
    id, title: str(x.title, 500), desc: str(x.desc, 20000), deadline: dstr(x.deadline),
    done: !!x.done, doneAt: +x.doneAt || 0, c: !!x.c, links: [], children: []
  };
  if (Array.isArray(x.links)) s.links = x.links.slice(0, 30).map(l => ({ url: safeUrl(l && l.url), label: str(l && l.label, 120) })).filter(l => l.url);
  if (depth < MAXD && Array.isArray(x.children)) s.children = x.children.slice(0, 500).map(c => cleanStep(c, depth + 1, seen)).filter(Boolean);
  return s;
}
function cleanProject(x) {
  if (!x || typeof x !== 'object' || !okId(x.id)) return null;
  const seen = new Set();
  const st = STATUS.includes(x.status) ? x.status : 'active';
  return {
    id: x.id, name: str(x.name, 200) || 'Untitled project', desc: str(x.desc, 4000), deadline: dstr(x.deadline),
    priority: ['high', 'med', 'low'].includes(x.priority) ? x.priority : '', tag: normTag(str(x.tag, 40)),
    status: st, archivedFrom: ['active', 'paused', 'completed'].includes(x.archivedFrom) ? x.archivedFrom : '',
    createdAt: +x.createdAt || Date.now(), updatedAt: +x.updatedAt || Date.now(), completedAt: +x.completedAt || 0,
    hideDone: !!x.hideDone,
    steps: (Array.isArray(x.steps) ? x.steps : []).slice(0, 1000).map(s => cleanStep(s, 0, seen)).filter(Boolean)
  };
}
function cleanNote(x) {
  if (!x || typeof x !== 'object' || !okId(x.id)) return null;
  let doodle = null;
  if (Array.isArray(x.doodle) && x.doodle.length) {
    doodle = x.doodle.slice(0, 300).map(st => Array.isArray(st) ? st.slice(0, 4000).map(n => Math.round(+n) || 0) : null).filter(st => st && st.length >= 2);
    if (!doodle.length) doodle = null;
  }
  const tags = Array.isArray(x.tags) ? [...new Set(x.tags.map(t => normTag(str(t, 40))).filter(Boolean))].slice(0, 12) : [];
  const ca = +x.createdAt || Date.now();
  return { id: x.id, text: str(x.text, 10000), tags, doodle, createdAt: ca, updatedAt: +x.updatedAt || ca };
}
function cleanMeta(x) {
  const m = { focus: [], theme: 'dark' };
  if (x && typeof x === 'object') {
    if (x.theme === 'light') m.theme = 'light';
    if (Array.isArray(x.focus)) m.focus = x.focus.slice(0, 100).filter(f => f && okId(f.s) && okId(f.p)).map(f => ({ s: f.s, p: f.p, at: +f.at || Date.now() }));
  }
  return m;
}
function hydrate(data) {
  S.projects = {}; S.notes = {};
  (data.projects || []).forEach(p => { const c = cleanProject(p); if (c) S.projects[c.id] = c; });
  (data.notes || []).forEach(n => { const c = cleanNote(n); if (c) S.notes[c.id] = c; });
  S.meta = cleanMeta(data.meta);
  Object.values(S.projects).forEach(normalize);
  pruneFocus();
}

/* ===================== tree helpers ===================== */
function walk(steps, fn, parent = null, depth = 0) {
  for (const s of steps) { fn(s, parent, depth); if (s.children.length) walk(s.children, fn, s, depth + 1); }
}
function findIn(steps, id, parent = null, depth = 0) {
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    if (s.id === id) return { s, parent, list: steps, idx: i, depth };
    if (s.children.length) { const r = findIn(s.children, id, s, depth + 1); if (r) return r; }
  }
  return null;
}
function locate(sid) {
  for (const p of Object.values(S.projects)) { const r = findIn(p.steps, sid); if (r) return { ...r, p }; }
  return null;
}
function subtreeDepth(s) { return 1 + (s.children.length ? Math.max(...s.children.map(subtreeDepth)) : 0); }
function stats(steps) {
  let t = 0, d = 0;
  const f = a => { for (const s of a) { if (s.children.length) f(s.children); else { t++; if (s.done) d++; } } };
  f(steps);
  return { t, d, left: t - d, pct: t ? Math.round(d / t * 100) : 0 };
}
function normalize(p) {
  const f = a => { for (const s of a) { if (s.children.length) { f(s.children); const dn = s.children.every(c => c.done); if (dn && !s.done) s.doneAt = Date.now(); s.done = dn; } } };
  f(p.steps);
}
function nextStep(p) { let r = null; walk(p.steps, s => { if (!r && !s.children.length && !s.done) r = s; }); return r; }
function setDone(s, val) { s.done = val; s.doneAt = val ? Date.now() : 0; s.children.forEach(c => setDone(c, val)); }
function eligible(p) { const st = stats(p.steps); return p.status === 'active' && st.t > 0 && st.left === 0; }
function visibleOrder(p) {
  const out = [];
  const f = a => { for (const s of a) { if (p.hideDone && s.done) continue; out.push(s.id); if (s.children.length && !s.c) f(s.children); } };
  f(p.steps);
  return out;
}

/* ===================== focus ===================== */
function pruneFocus() {
  const sod = startOfToday();
  S.meta.focus = S.meta.focus.filter(f => {
    const l = locate(f.s);
    if (!l) return false;
    if (l.s.done && l.s.doneAt && l.s.doneAt < sod) return false;
    return true;
  });
}
const inFocus = sid => S.meta.focus.some(f => f.s === sid);

/* ===================== undo / commit ===================== */
const UNDO = { stack: [], redo: [] };
const snapshot = () => JSON.stringify({ p: S.projects, n: S.notes, f: S.meta.focus });
function restore(json) {
  const o = JSON.parse(json);
  S.projects = o.p; S.notes = o.n; S.meta.focus = o.f;
}
let renderFn = () => {};
function commit(fn, opts = {}) {
  const snap = snapshot();
  fn();
  Object.values(S.projects).forEach(normalize);
  pruneFocus();
  if (snapshot() === snap) return false;
  UNDO.stack.push(snap); if (UNDO.stack.length > 60) UNDO.stack.shift();
  UNDO.redo = [];
  schedulePersist();
  if (opts.render !== false) renderFn();
  return true;
}
function undo() {
  const snap = UNDO.stack.pop(); if (!snap) return false;
  UNDO.redo.push(snapshot()); restore(snap); schedulePersist(); renderFn(); return true;
}
function redo() {
  const snap = UNDO.redo.pop(); if (!snap) return false;
  UNDO.stack.push(snapshot()); restore(snap); schedulePersist(); renderFn(); return true;
}
function touch(p) { p.updatedAt = Date.now(); }

/* ===================== persistence ===================== */
const LS_KEY = 'fieldbook.v1', LS_THEME = 'fieldbook.theme';
const Sync = { cfg: null, busy: false, again: false, timer: null, state: 'idle', last: 0, msg: '' };
const Store = { mode: 'local', base: null, metaRef: null, persisted: new Map(), flushing: false, again: false, timer: null, status: 'saved', lsOk: true, dbFail: false };

function exportData() {
  return {
    app: 'fieldbook', version: 1, exportedAt: new Date().toISOString(),
    projects: Object.values(S.projects), notes: Object.values(S.notes),
    meta: { theme: S.meta.theme, focus: S.meta.focus }
  };
}
function lsRead() { try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function lsWrite() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(exportData())); Store.lsOk = true; } catch (e) { Store.lsOk = false; }
}
function themeRead() { try { return localStorage.getItem(LS_THEME); } catch (e) { return null; } }
function themeWrite(t) { try { localStorage.setItem(LS_THEME, t); } catch (e) {} }

function setStatus(s) {
  Store.status = s;
  let txt = 'Saved', st = s;
  if (s === 'saving') txt = 'Saving…';
  else if (s === 'error') txt = Store.msg || 'Not saved. Retry';
  else if (Store.mode === 'local') { txt = Store.lsOk ? 'Saved in this browser' : 'Not saved. Export a backup'; if (!Store.lsOk) st = 'error'; }
  if (Store.mode === 'local' && Sync.cfg && st !== 'error') {
    if (Sync.state === 'syncing') { txt = 'Syncing…'; st = 'saving'; }
    else if (Sync.state === 'error') { txt = 'Sync problem. Tap to fix'; st = 'error'; }
    else if (Sync.state === 'ok') txt = 'Synced ' + ago(Sync.last);
    else txt = 'Waiting to sync';
  }
  $$('.sync').forEach(el => { el.dataset.s = st; const t = el.querySelector('span'); if (t) t.textContent = txt; });
}

function docsNow() {
  const m = new Map();
  for (const p of Object.values(S.projects)) m.set('p:' + p.id, { c: 'projects', id: p.id, data: p });
  for (const n of Object.values(S.notes)) m.set('n:' + n.id, { c: 'notes', id: n.id, data: n });
  m.set('meta', { c: 'meta', data: { theme: S.meta.theme, focus: S.meta.focus, v: 1 } });
  return m;
}
function refFor(d) {
  if (d.c === 'meta') return Store.metaRef;
  return Store.base.collection(d.c).doc(d.id);
}
function schedulePersist() {
  lsWrite();
  if (Sync.cfg && typeof scheduleSync === 'function') scheduleSync(2500);
  if (Store.mode !== 'db') { setStatus('saved'); return; }
  setStatus('saving');
  clearTimeout(Store.timer);
  Store.timer = setTimeout(flush, 450);
}
async function flush() {
  if (Store.mode !== 'db') return;
  if (Store.flushing) { Store.again = true; return; }
  Store.flushing = true;
  try {
    do {
      Store.again = false;
      const docs = docsNow();
      for (const [key, d] of docs) {
        const json = JSON.stringify(d.data);
        if (Store.persisted.get(key) === json) continue;
        try { await refFor(d).set(JSON.parse(json)); }
        catch (e) {
          if (e && e.code === 'invalid_argument' && json.length > 240000) { Store.msg = 'A project is too large to sync'; throw e; }
          if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { switchToLocal(); return; }
          throw e;
        }
        Store.persisted.set(key, json);
      }
      for (const key of [...Store.persisted.keys()]) {
        if (docs.has(key)) continue;
        const [k, id] = [key[0], key.slice(2)];
        const ref = key === 'meta' ? Store.metaRef : Store.base.collection(k === 'p' ? 'projects' : 'notes').doc(id);
        await ref.delete();
        Store.persisted.delete(key);
      }
    } while (Store.again);
    Store.msg = '';
    setStatus('saved');
    if (Store.hadError) { Store.hadError = false; renderFn(); }
  } catch (e) {
    if (!Store.msg) Store.msg = 'Not saved. Retry';
    Store.hadError = true;
    setStatus('error');
    showErrorBar();
  } finally { Store.flushing = false; }
}
function switchToLocal() {
  Store.mode = 'local'; Store.flushing = false; lsWrite(); setStatus('saved');
  toast('Cloud storage is unavailable here. Changes are saved in this browser only.');
}
function retrySave() { Store.msg = ''; setStatus('saving'); flush(); }
let showErrorBar = () => {};

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

async function loadAll() {
  const local = lsRead();
  let remote = null;
  try {
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      const [db, user] = await withTimeout(Promise.all([c.use('db'), c.use('user')]), 11000);
      const id = (db && user) ? await withTimeout(user.id(), 5000) : null;
      if (db && id) {
        Store.base = db.doc('data/users/' + id + '/store');
        Store.metaRef = db.doc('data/users/' + id + '/meta');
        const [ps, ns, ms] = await withTimeout(Promise.all([Store.base.collection('projects').get(), Store.base.collection('notes').get(), Store.metaRef.get()]), 12000);
        remote = { projects: ps.docs.map(d => d.data()), notes: ns.docs.map(d => d.data()), meta: ms.exists ? ms.data() : null };
        Store.mode = 'db';
      }
    }
  } catch (e) { remote = null; Store.mode = 'local'; }

  const hasLocal = local && ((local.projects || []).length || (local.notes || []).length);
  const hasRemote = remote && (remote.projects.length || remote.notes.length || remote.meta);
  if (hasRemote) {
    hydrate(remote);
    Store.persisted = new Map();
    for (const [k, d] of docsNow()) Store.persisted.set(k, JSON.stringify(d.data));
  } else if (hasLocal) {
    hydrate(local);
    if (Store.mode === 'db') setTimeout(() => { setStatus('saving'); flush(); }, 50);
  } else {
    hydrate({});
    const th = themeRead(); if (th === 'light') S.meta.theme = 'light';
  }
  if (local && local.meta && !hasRemote && local.meta.theme === 'light') S.meta.theme = 'light';
  lsWrite();
}

  capTags: new Set(), reveal: null, animate: true, dragId: null, stepQ: '', dismissed: new Set(), ph: 0, booted: false, loadError: ''

const draft = k => esc(UI.drafts[k] || '');
const projectsBy = st => Object.values(S.projects).filter(p => p.status === st);
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

function bar(key, pct, cls = '') {
  return `<div class="bar ${pct === 100 ? 'full' : ''} ${cls}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i data-bk="${key}" style="width:${pct}%"></i></div>`;
}
function dueChip(date, done) {
  if (!date) return '';
  const n = diff(date, today());
  let cls = '';
  if (done) cls = 'done'; else if (n < 0) cls = 'late'; else if (n <= 2) cls = 'soon';
  const t = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : short(date);
  return `<span class="chip ${cls}" title="${esc(shortDow(date))}">${esc(t)}</span>`;
}
const priChip = p => p.priority ? `<span class="chip ${p.priority === 'high' ? 'pri-high' : ''}">${PRI_LABEL[p.priority]}</span>` : '';
const tagChip = p => p.tag ? `<span class="chip tag">#${esc(p.tag)}</span>` : '';
function cb(on, part, attrs, label) {
  return `<button class="cb ${on ? 'on' : part ? 'part' : ''}" ${attrs} aria-pressed="${on}" aria-label="${esc(label)}">${on ? ico('check', 12) : ''}</button>`;
}
function emptyBlock(title, body, btn) { return `<div class="empty"><b>${esc(title)}</b>${body}${btn || ''}</div>`; }

function dueItems() {
  const items = [];
  for (const p of Object.values(S.projects)) {
    if (p.status === 'archived') continue;
    if (p.deadline) items.push({ kind: 'project', date: p.deadline, title: p.name, pid: p.id, done: p.status === 'completed', paused: p.status === 'paused', pstatus: p.status });
    walk(p.steps, s => {
      if (s.deadline) items.push({ kind: 'step', date: s.deadline, title: s.title || 'Untitled step', pid: p.id, sid: s.id, pname: p.name, done: s.done, doneAt: s.doneAt, paused: p.status === 'paused', pstatus: p.status });
    });
  }
  return items;
}
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === b.kind ? 0 : a.kind === 'project' ? -1 : 1);

    <div class="sec-title">Today’s focus ${focus.length ? `<span class="n">${fdone}/${focus.length}</span>` : ''}<span class="sp"><button class="btn sm quiet" data-act="focus-pick">${ico('plus', 14)} Pick</button></span></div>

      : `<div class="empty flush"><span class="muted">Nothing picked for today. Choose a few steps you feel like doing, or leave it empty.</span></div>`}
  </section>`;

  /* upcoming */
  const items = dueItems().filter(i => i.pstatus === 'active');

  const doneR = items.filter(i => i.done && i.kind === 'step' && i.doneAt > Date.now() - 7 * 864e5).sort((a, b) => b.doneAt - a.doneAt).slice(0, 3);
  const row = i => {

  const upHtml = `<section><div class="sec-title">Upcoming deadlines<span class="sp"><button class="btn sm quiet" data-act="go" data-to="calendar">Calendar</button></span></div>

    <form class="capture" data-form="cap" autocomplete="off">
      ${ico('inbox', 18)}

/* ===================== projects list ===================== */
function viewProjects() {
  const all = Object.values(S.projects).filter(p => p.status !== 'archived');
  const cnt = { active: 0, paused: 0, completed: 0, all: all.length };
  all.forEach(p => cnt[p.status]++);
  let list = all.filter(p => UI.pf === 'all' || p.status === UI.pf);
  const q = UI.pq.trim().toLowerCase();
  if (q) list = list.filter(p => (p.name + ' ' + p.desc + ' ' + p.tag).toLowerCase().includes(q) || (() => { let hit = false; walk(p.steps, s => { if (!hit && (s.title + ' ' + s.desc).toLowerCase().includes(q)) hit = true; }); return hit; })());
  if (UI.ptag) list = list.filter(p => p.tag === UI.ptag);
  const sorts = {
    priority: (a, b) => (PRI[b.priority] - PRI[a.priority]) || a.name.localeCompare(b.name),
    deadline: (a, b) => (a.deadline || '9999') < (b.deadline || '9999') ? -1 : (a.deadline || '9999') > (b.deadline || '9999') ? 1 : a.name.localeCompare(b.name),
    recent: (a, b) => b.updatedAt - a.updatedAt,
    name: (a, b) => a.name.localeCompare(b.name),
    progress: (a, b) => stats(b.steps).pct - stats(a.steps).pct
  };
  list.sort(sorts[UI.psort] || sorts.priority);
  const tags = [...new Set(all.map(p => p.tag).filter(Boolean))].sort();

  const rows = list.map(p => {
    const st = stats(p.steps);
    return `<div class="prow" data-act="go" data-to="project-${p.id}" tabindex="0" role="link" aria-label="${esc(p.name)}">
      <div style="min-width:0"><div class="nm">${esc(p.name)}</div>${p.desc ? `<div class="ds">${esc(p.desc)}</div>` : ''}

  let body;

  else if (!list.length) body = emptyBlock('Nothing matches.', `<p class="muted" style="margin:4px 0 0">Try another filter, or search by a word from a step. Archived projects live in Archived.</p>`, `<button class="btn" data-act="clear-pfilters">Clear filters</button>`);
  else body = `<div>${rows}</div>`;

  return `<div class="page-head"><h1 class="display">Projects</h1><button class="btn primary" data-act="new-project">${ico('plus', 15)} New project <kbd>N</kbd></button></div>
    <div class="toolbar">

/* ===================== project page ===================== */
function stepMatches(s, q) {
  if (!q) return true;
  if ((s.title + ' ' + s.desc).toLowerCase().includes(q)) return true;
  return s.children.some(c => stepMatches(c, q));
}
function addStepRow(attr, id, ph) {
  return `<div class="add-step">${ico('plus', 16)}<input class="ghost-in" ${attr}="${id}" data-draft="${attr === 'data-add-step' ? 'add:' : 'sub:'}${id}" value="${draft((attr === 'data-add-step' ? 'add:' : 'sub:') + id)}" placeholder="${esc(ph)}" autocomplete="off" aria-label="${esc(ph)}"></div>`;
}
function stepDetail(p, s, depth) {
  const links = s.links.map((l, i) => `<div class="lk">${ico('link', 14)}<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || host(l.url))}</a><span class="u">${esc(host(l.url))}</span><button class="icon-btn" data-act="link-del" data-sid="${s.id}" data-i="${i}" aria-label="Remove link">${ico('x', 13)}</button></div>`).join('');
  const after = p.deadline && s.deadline && diff(s.deadline, p.deadline) > 0;
  return `<div class="sdetail" data-detail="${s.id}">
    <div><label class="lab" for="d-${s.id}">Notes</label><textarea class="field" id="d-${s.id}" data-field="step-desc" data-sid="${s.id}" placeholder="Details, context, thoughts…">${esc(s.desc)}</textarea></div>
    <div class="row2"><div><label class="lab" for="due-${s.id}">Deadline</label><input type="date" class="field" id="due-${s.id}" style="width:auto" data-field="step-deadline" data-sid="${s.id}" value="${s.deadline}"></div>
      ${s.deadline ? `<button class="btn sm quiet" data-act="step-deadline-clear" data-sid="${s.id}" style="margin-top:18px">Clear date</button>` : ''}
      ${after ? `<span class="hint late" style="margin-top:18px">After the project deadline (${esc(short(p.deadline))})</span>` : ''}</div>
    <div><label class="lab" for="lk-${s.id}">Links</label>${links ? `<div class="links" style="margin-bottom:8px">${links}</div>` : ''}<input class="field" id="lk-${s.id}" data-field="link-add" data-sid="${s.id}" placeholder="Paste a link and press Enter" autocomplete="off"></div>
    ${depth < MAXD ? `<div><label class="lab" for="sub-${s.id}">Subtasks</label><input class="field" id="sub-${s.id}" data-add-sub="${s.id}" data-draft="sub:${s.id}" value="${draft('sub:' + s.id)}" placeholder="Add a subtask and press Enter" autocomplete="off"></div>` : ''}
  </div>`;
}
function stepRow(p, s, depth, q) {
  const kids = s.children, hasKids = kids.length;
  const ks = hasKids ? stats(kids) : null;
  const partial = hasKids && !s.done && ks.d > 0;
  const open = UI.open.has(s.id);
  const expanded = hasKids && (q ? true : !s.c);
  let kidHtml = '';
  if (expanded) {
    const vis = kids.filter(c => !(p.hideDone && c.done) && stepMatches(c, q));
    kidHtml = `<div class="kids">${vis.map(c => stepRow(p, c, depth + 1, q)).join('')}</div>`;
  }
  const meta = [];
  if (s.deadline) meta.push(dueChip(s.deadline, s.done));
  if (hasKids) meta.push(`<span class="mini">${ks.d}/${ks.t}${bar('s' + s.id, ks.pct, 'sm')}</span>`);
  if (s.links.length) meta.push(`<span title="${plural(s.links.length, 'link', 'links')}" style="display:inline-flex;gap:3px;align-items:center">${ico('link', 13)}${s.links.length}</span>`);
  if (s.desc.trim()) meta.push(`<span title="Has notes">${ico('note', 13)}</span>`);
  if (inFocus(s.id)) meta.push(`<span title="In today’s focus" style="color:var(--accent)">${ico('target', 14)}</span>`);
  return `<div class="step ${s.done ? 'done' : ''}" data-sid="${s.id}" data-depth="${depth}">
    <div class="srow" data-row="${s.id}">
      <span class="grip" draggable="true" data-drag="${s.id}" title="Drag to reorder" aria-hidden="true">${ico('grip', 14)}</span>
      ${cb(s.done, partial, `data-act="step-toggle" data-sid="${s.id}"`, (s.done ? 'Mark not done: ' : 'Mark done: ') + s.title)}
      <button class="chev ${hasKids ? (expanded ? 'open' : '') : 'none'}" data-act="step-collapse" data-sid="${s.id}" aria-label="${expanded ? 'Collapse' : 'Expand'} subtasks" ${hasKids ? '' : 'tabindex="-1"'}>${ico('chev', 14)}</button>
      <textarea class="stitle" rows="1" data-step-title="${s.id}" placeholder="Step" aria-label="Step title" spellcheck="true">${esc(s.title)}</textarea>
      <div class="smeta">${meta.join('')}</div>
      <div class="sact"><button class="icon-btn" data-act="step-open" data-sid="${s.id}" aria-label="Details" aria-expanded="${open}" title="Details">${ico('note', 15)}</button><button class="icon-btn" data-act="step-menu" data-sid="${s.id}" aria-label="More actions" title="More">${ico('more', 16)}</button></div>
    </div>
    ${open ? stepDetail(p, s, depth) : ''}${kidHtml}</div>`;
}
function viewProject(id) {
  const p = S.projects[id];
  if (!p) return `<a class="crumb" href="#projects" data-act="go" data-to="projects">${ico('back', 15)} Projects</a>${emptyBlock('That project is gone.', `<p class="muted" style="margin:4px 0 0">It may have been deleted. You can undo a delete right after it happens.</p>`, `<button class="btn" data-act="go" data-to="projects">Back to projects</button>`)}`;
  const st = stats(p.steps);
  const hasKids = (() => { let h = false; walk(p.steps, s => { if (s.children.length) h = true; }); return h; })();
  const anyDone = (() => { let h = false; walk(p.steps, s => { if (s.done) h = true; }); return h; })();
  const total = (() => { let n = 0; walk(p.steps, () => n++); return n; })();
  const q = UI.stepQ.trim().toLowerCase();
  const top = p.steps.filter(s => !(p.hideDone && s.done) && stepMatches(s, q));
  const tags = [...new Set(Object.values(S.projects).map(x => x.tag).filter(Boolean))];

  let banner = '';

/* ===================== inbox ===================== */
function strokePath(pts) {
  if (pts.length < 4) return `M${pts[0]} ${pts[1]}l.1 0`;
  let d = `M${pts[0]} ${pts[1]}`;
  for (let i = 2; i < pts.length - 2; i += 2) d += `Q${pts[i]} ${pts[i + 1]} ${(pts[i] + pts[i + 2]) >> 1} ${(pts[i + 1] + pts[i + 3]) >> 1}`;
  return d + `L${pts[pts.length - 2]} ${pts[pts.length - 1]}`;
}
function doodleSvg(strokes, cls = 'doodle') {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  strokes.forEach(s => { for (let i = 0; i < s.length; i += 2) { x0 = Math.min(x0, s[i]); x1 = Math.max(x1, s[i]); y0 = Math.min(y0, s[i + 1]); y1 = Math.max(y1, s[i + 1]); } });
  const pdg = 14; x0 -= pdg; y0 -= pdg; x1 += pdg; y1 += pdg;
  let w = Math.max(x1 - x0, 140), h = Math.max(y1 - y0, 70);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const sw = Math.max(2, w / 150);
  return `<svg class="${cls}" viewBox="${(cx - w / 2).toFixed(0)} ${(cy - h / 2).toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" role="img" aria-label="Sketch" fill="none" stroke="currentColor" stroke-width="${sw.toFixed(1)}" stroke-linecap="round" stroke-linejoin="round">${strokes.map(s => `<path d="${strokePath(s)}"/>`).join('')}</svg>`;
}

      ${n.doodle ? doodleSvg(n.doodle) : ''}

function calItem(i, full) {

}
function viewCalendar() {
  const items = dueItems();
  const by = {};
  items.forEach(i => (by[i.date] = by[i.date] || []).push(i));
  Object.values(by).forEach(a => a.sort(byDate));
  const base = pd(UI.calDate);
  let days = [], title;
  const t0 = today();
  if (UI.calView === 'month') {
    const first = new Date(base.getFullYear(), base.getMonth(), 1);
    const start = monday(ds(first));
    for (let i = 0; i < 42; i++) days.push(addDays(start, i));
    if (days.slice(35).every(d => pd(d).getMonth() !== base.getMonth())) days = days.slice(0, 35);
    title = `${MONL[base.getMonth()]} <span>${base.getFullYear()}</span>`;
  } else {
    const start = monday(UI.calDate);
    for (let i = 0; i < 7; i++) days.push(addDays(start, i));
    const a = pd(days[0]), b = pd(days[6]);
    title = a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MONL[a.getMonth()]} <span>${b.getFullYear()}</span>` : `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]} <span>${b.getFullYear()}</span>`;
  }
  const maxShow = UI.calView === 'week' ? 50 : 3;
  const cells = days.map(d => {
    const its = by[d] || [];
    const dt = pd(d);
    const out = UI.calView === 'month' && dt.getMonth() !== base.getMonth();
    const shown = its.slice(0, maxShow);
    return `<div class="cal-cell ${out ? 'out' : ''} ${d === t0 ? 'today' : ''} ${d === UI.calSel ? 'sel' : ''}" data-act="cal-sel" data-date="${d}" tabindex="0" role="button" aria-label="${esc(shortDow(d))}, ${plural(its.length, 'item', 'items')}">
      <span class="dn">${UI.calView === 'week' ? DOW[dt.getDay()] + ' ' + dt.getDate() : dt.getDate()}</span>
      <div class="dots">${shown.map(i => calItem(i)).join('')}${its.length > maxShow ? `<span class="cal-more">+${its.length - maxShow} more</span>` : ''}</div></div>`;
  }).join('');
  const sel = by[UI.calSel] || [];
  const sd = pd(UI.calSel);
  const dayRows = sel.map(i => `<div class="li ${i.done ? 'done' : ''}">
      ${i.kind === 'step' ? cb(i.done, false, `data-act="step-toggle" data-sid="${i.sid}"`, (i.done ? 'Mark not done: ' : 'Mark done: ') + i.title) : `<span style="color:var(--accent);margin-top:2px;display:grid;place-items:center;width:18px">◇</span>`}
      <button class="body" data-act="open-item" data-pid="${i.pid}" ${i.sid ? `data-sid="${i.sid}"` : ''}><div class="t">${esc(i.title)}</div><div class="s">${i.kind === 'project' ? 'Project deadline' : esc(i.pname)}${i.paused ? ' · paused' : ''}</div></button></div>`).join('');
  return `<div class="cal-head"><h1 class="display">${title}</h1>
      <div class="seg"><button class="${UI.calView === 'month' ? 'on' : ''}" data-act="cal-view" data-v="month">Month</button><button class="${UI.calView === 'week' ? 'on' : ''}" data-act="cal-view" data-v="week">Week</button></div>
      <button class="btn sm" data-act="cal-today">Today</button>
      <div style="display:flex;gap:2px"><button class="icon-btn" data-act="cal-nav" data-v="-1" aria-label="Previous">${ico('back', 18)}</button><button class="icon-btn" data-act="cal-nav" data-v="1" aria-label="Next">${ico('chev', 18)}</button></div></div>
    <div class="cal ${UI.calView}">${UI.calView === 'month' ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div class="dow">${x}</div>`).join('') : ''}${cells}</div>
    <div class="legend"><span><i class="d"></i>Project deadline</span><span><i></i>Step deadline</span><span><i style="background:var(--good)"></i>Done</span><span><i style="background:var(--late)"></i>Past due</span></div>
    <section class="day-panel"><h2>${esc(DOWL[sd.getDay()])}, ${sd.getDate()} ${MONL[sd.getMonth()]}${UI.calSel === t0 ? ' <span class="faint" style="font-style:italic">today</span>' : ''}</h2>
      ${sel.length ? `<div class="list">${dayRows}</div>` : `<div class="empty flush"><span class="muted">Nothing due this day.</span></div>`}</section>`;

function newProject(f = {}) {

  return { id: mkid('p'), name: (f.name || '').trim().slice(0, 200) || 'Untitled project', desc: (f.desc || '').slice(0, 4000), deadline: dstr(f.deadline || ''),

const firstLine = text => {
  const lines = String(text || '').trim().split('\n');
  let title = lines[0].trim(), rest = lines.slice(1).join('\n').trim();
  if (title.length > 140) { const cut = title.slice(0, 140).replace(/\s+\S*$/, ''); rest = (title.slice(cut.length).trim() + (rest ? '\n' + rest : '')).trim(); title = cut + '…'; }
  return { title, rest };
};
function parseTags(text) {
  const tags = [];
  const clean = String(text || '').replace(/(^|\s)#([\p{L}\p{N}_-]{1,24})(?=\s|$|[.,;!?])/gu, (m, sp, t) => { tags.push(normTag(t)); return sp; }).replace(/[ \t]+\n/g, '\n').replace(/ {2,}/g, ' ').trim();
  return { text: clean, tags };
}
function autosize(el) {
  if (!el || !el.isConnected) return;

    if (sel) keep = { sel, start: ae.selectionStart, end: ae.selectionEnd };

  else {

  UI.animate = false;

  main.scrollTop = scrollTop0 ? 0 : scroll; scrollTop0 = false;

  }
}

function addSteps(pid, parentId, titles, atEnd = true) {
  const p = S.projects[pid]; if (!p) return [];
  let ids = [];
  commit(() => {
    let list = p.steps, baseDepth = 0;
    if (parentId) { const r = findIn(p.steps, parentId); if (r) { list = r.s.children; baseDepth = r.depth + 1; r.s.c = false; } }
    const items = titles.map(t => typeof t === 'string' ? { title: t, depth: 0 } : t);
    const stack = [list];
    for (const it of items) {
      const lvl = Math.min(it.depth, stack.length - 1, MAXD - baseDepth);
      const s = newStep(it.title.slice(0, 500));
      stack[lvl].push(s); ids.push(s.id);
      stack.length = lvl + 1; stack.push(s.children);
    }
    touch(p);
  });

}
function parseOutline(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const levels = [];
  return lines.map(l => {
    const w = (/^[ \t]*/.exec(l)[0]).replace(/\t/g, '  ').length;
    while (levels.length && levels[levels.length - 1] > w) levels.pop();
    if (!levels.length || levels[levels.length - 1] < w) levels.push(w);
    const title = l.trim().replace(/^([-*•]|\d+[.)]|\[[ xX]?\])\s+/, '').replace(/^\[[ xX]?\]\s*/, '');
    return { title, depth: levels.length - 1 };
  }).filter(i => i.title);
}
function indentStep(sid) {
  const r = locate(sid); if (!r || r.idx === 0) return false;
  if (r.depth + subtreeDepth(r.s) > MAXD) { toast('That is as deep as steps can nest.'); return false; }
  commit(() => { const prev = r.list[r.idx - 1]; r.list.splice(r.idx, 1); prev.children.push(r.s); prev.c = false; touch(r.p); });
  return true;
}
function outdentStep(sid) {
  const r = locate(sid); if (!r || !r.parent) return false;
  commit(() => {
    const pr = findIn(r.p.steps, r.parent.id);
    r.list.splice(r.idx, 1); pr.list.splice(pr.idx + 1, 0, r.s); touch(r.p);
  });
  return true;
}

  const r = locate(sid); if (!r) return false;
  const j = r.idx + dir; if (j < 0 || j >= r.list.length) return false;
  commit(() => { const [s] = r.list.splice(r.idx, 1); r.list.splice(j, 0, s); touch(r.p); });
  return true;
}
function moveStep(id, targetId, pos) {
  const a = locate(id), b = locate(targetId);
  if (!a || !b || a.p !== b.p || id === targetId) return false;
  if (findIn(a.s.children, targetId)) return false;
  const nd = pos === 'into' ? b.depth + 1 : b.depth;
  if (nd + subtreeDepth(a.s) - 1 > MAXD) { toast('That is as deep as steps can nest.'); return false; }
  commit(() => {
    a.list.splice(a.idx, 1);
    const t = findIn(a.p.steps, targetId);
    if (pos === 'into') { t.s.children.push(a.s); t.s.c = false; }
    else t.list.splice(t.idx + (pos === 'after' ? 1 : 0), 0, a.s);

}

  if (n) {
    const ok = await confirmBox({ title: 'Delete this step?', body: `<b>${esc(r.s.title || 'Untitled step')}</b> and its ${plural(n, 'subtask', 'subtasks')} will be removed. You can undo this right after.` });

}

function importFile(file) {

    let d; try { d = JSON.parse(String(rd.result)); } catch (e) { toast('That file is not valid JSON.'); return; }
    if (!d || typeof d !== 'object' || (!Array.isArray(d.projects) && !Array.isArray(d.notes))) { toast('That does not look like a Fieldbook backup.'); return; }
    const projects = (d.projects || []).map(cleanProject).filter(Boolean), notes = (d.notes || []).map(cleanNote).filter(Boolean);
    if (!projects.length && !notes.length) { toast('The backup has no projects or notes.'); return; }
    MODAL.imp = { projects, notes, focus: cleanMeta(d.meta).focus };
    openModal(`<h2>Import backup</h2><p>Found <b>${plural(projects.length, 'project', 'projects')}</b> and <b>${plural(notes.length, 'note', 'notes')}</b>.</p>

      <div class="actions"><button class="btn quiet" data-act="close-modal">Cancel</button><button class="btn danger" data-act="import-go" data-v="replace">Replace everything</button><button class="btn primary" data-act="import-go" data-v="merge">Merge</button></div>`, '', 'import');

}
function doImport(mode) {

    imp.projects.forEach(p => { S.projects[p.id] = p; });
    imp.notes.forEach(n => { S.notes[n.id] = n; });
    imp.focus.forEach(f => { if (!S.meta.focus.some(x => x.s === f.s)) S.meta.focus.push(f); });
  });
  MODAL.imp = null;
  toast(mode === 'replace' ? 'Backup restored' : 'Backup merged', { undo: true });
}

  const pad = e.target.closest && e.target.closest('#pad'); if (!pad || e.button > 0) return;
  e.preventDefault(); pad.setPointerCapture(e.pointerId);
  const pt = ev => { const r = pad.getBoundingClientRect(); return [Math.round((ev.clientX - r.left) / r.width * 600), Math.round((ev.clientY - r.top) / r.height * 300)]; };
  const [x, y] = pt(e);
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  pad.appendChild(path);
  drawing = { pad, pts: [x, y], path, pt };
  path.setAttribute('d', strokePath(drawing.pts));
  const hint = pad.parentElement.querySelector('.pad-hint'); if (hint) hint.remove();
});
document.addEventListener('pointermove', e => {
  if (!drawing) return;
  const [x, y] = drawing.pt(e); const n = drawing.pts.length;
  if (Math.abs(x - drawing.pts[n - 2]) + Math.abs(y - drawing.pts[n - 1]) < 3) return;
  drawing.pts.push(x, y); drawing.path.setAttribute('d', strokePath(drawing.pts));
});
const endDraw = () => { if (!drawing) return; if (drawing.pts.length >= 2) UI.doodle.push(drawing.pts); drawing = null; };
document.addEventListener('pointerup', endDraw);
document.addEventListener('pointercancel', endDraw);

/* ===================== boot ===================== */
window.addEventListener('hashchange', onRoute);
window.addEventListener('resize', () => { if (!$('#pop').hidden) closePop(); });
$('#main').addEventListener('scroll', () => { if (!$('#pop').hidden) closePop(); }, { passive: true });
$('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (Store.mode === 'db') flush(); }
  else if (UI.booted && UI.stamp !== today()) { UI.stamp = today(); UI.calDate = UI.calDate; render(); }
});
setInterval(() => { if (UI.booted && UI.stamp && UI.stamp !== today()) { UI.stamp = today(); render(); } }, 60000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => autosizeAll());

(async function boot() {
  const th = themeRead(); document.documentElement.dataset.theme = th === 'light' ? 'light' : 'dark';
  UI.ph = Math.floor(Math.random() * PLACEHOLDERS.length);
  routeKey = location.hash.slice(1) || 'home'; UI.route = parseRoute();
  render();
  await loadAll();
  UI.booted = true; UI.stamp = today(); UI.animate = true;
  setStatus('saved'); render();
  if (typeof initSync === 'function') initSync();
  if (window.__FB_TEST) window.__fieldbook = { S, UI, Store, commit, go, undo, redo, toast };
})();

/* ===================== github sync ===================== */
const SYNC_KEY = 'fieldbook.sync', BASE_KEY = 'fieldbook.syncbase';
const syncAvailable = () => !(window.claude && typeof window.claude.use === 'function');
function loadCfg() { try { const c = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); return c && c.repo && c.token ? c : null; } catch (e) { return null; } }
function saveCfg(c) {
  try { if (c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else { localStorage.removeItem(SYNC_KEY); localStorage.removeItem(BASE_KEY); } } catch (e) {}
}
function loadBase() { try { return JSON.parse(localStorage.getItem(BASE_KEY) || '{}'); } catch (e) { return {}; } }
function saveBase(b) { try { localStorage.setItem(BASE_KEY, JSON.stringify(b)); } catch (e) {} }

const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => { const bin = atob(String(s).replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); };

function ghFetch(path, opt = {}) {
  return fetch('https://api.github.com' + path, {
    ...opt, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + Sync.cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) }
  });
}
const filePath = () => `/repos/${Sync.cfg.repo}/contents/${Sync.cfg.path.split('/').map(encodeURIComponent).join('/')}`;
async function fetchRemote() {
  const q = Sync.cfg.branch ? '?ref=' + encodeURIComponent(Sync.cfg.branch) : '';
  const r = await ghFetch(filePath() + q);
  if (r.status === 404) return { data: null, sha: null };
  if (r.status === 401) throw new Error('GitHub rejected the token. It may have expired.');
  if (r.status === 403) throw new Error('GitHub refused the request (token permissions or rate limit).');
  if (!r.ok) throw new Error('GitHub error ' + r.status);
  const j = await r.json();
  if (j.content === undefined || (!j.content && j.size)) throw new Error('The data file is too large to sync.');
  return { data: JSON.parse(b64dec(j.content)), sha: j.sha };
}
async function putRemote(payload, sha) {
  const body = { message: 'Fieldbook sync', content: b64enc(JSON.stringify(payload)) };
  if (sha) body.sha = sha;
  if (Sync.cfg.branch) body.branch = Sync.cfg.branch;
  const r = await ghFetch(filePath(), { method: 'PUT', body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (r.status === 401) throw new Error('GitHub rejected the token. It may have expired.');
  if (r.status === 403 || r.status === 404) throw new Error('The token cannot write to this repository. Give it Contents: Read and write.');
  if (!r.ok) throw new Error('GitHub error ' + r.status);
}

const canonOf = { p: x => JSON.stringify(cleanProject(x)), n: x => JSON.stringify(cleanNote(x)), f: x => JSON.stringify(x) };
const stamp = { p: x => x.updatedAt || 0, n: x => x.updatedAt || 0, f: x => x.at || 0 };
function mergeKind(kind, local, remote, base) {
  const out = {}, canon = canonOf[kind], ts = stamp[kind];
  for (const id of new Set([...Object.keys(local), ...Object.keys(remote), ...Object.keys(base)])) {
    const l = local[id], r = remote[id], b = base[id];
    const lj = l && canon(l), rj = r && canon(r);
    if (l && r) {
      if (lj === rj) out[id] = l;
      else if (lj === b) out[id] = r;
      else if (rj === b) out[id] = l;
      else out[id] = ts(l) > ts(r) ? l : r;
    } else if (l) { if (b === undefined || lj !== b) out[id] = l; }
    else if (r) { if (b === undefined || rj !== b) out[id] = r; }
  }
  return out;
}
const focusMap = () => Object.fromEntries(S.meta.focus.map(f => [f.s, f]));
function remoteMaps(d) {
  const m = { p: {}, n: {}, f: {} };
  if (!d) return m;
  (d.projects || []).forEach(x => { const c = cleanProject(x); if (c) m.p[c.id] = c; });
  (d.notes || []).forEach(x => { const c = cleanNote(x); if (c) m.n[c.id] = c; });
  cleanMeta({ focus: d.focus }).focus.forEach(f => { m.f[f.s] = f; });
  return m;
}
const canonMap = (kind, map) => Object.fromEntries(Object.entries(map).map(([k, v]) => [k, canonOf[kind](v)]));
const sameCanon = (a, b) => { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => a[k] === b[k]); };
const editingNow = () => { const a = document.activeElement; return a && $('#view') && $('#view').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'cap'; };

function setSync(state, msg = '') { Sync.state = state; Sync.msg = msg; if (state === 'ok') Sync.last = Date.now(); setStatus(Store.status === 'error' ? 'error' : 'saved'); }
function scheduleSync(delay = 2500) { clearTimeout(Sync.timer); Sync.timer = setTimeout(syncNow, delay); }

async function syncNow() {
  if (!Sync.cfg) return;
  if (Sync.busy) { Sync.again = true; return; }
  if (editingNow()) { scheduleSync(4000); return; }
  if (navigator.onLine === false) { setSync('error', 'You are offline. Changes are kept on this device.'); return; }
  Sync.busy = true; setSync('syncing');
  try {
    let done = false;
    for (let attempt = 0; attempt < 3 && !done; attempt++) {
      const rem = await fetchRemote();
      const R = remoteMaps(rem.data), base = loadBase();
      const L = { p: S.projects, n: S.notes, f: focusMap() };
      const M = {
        p: mergeKind('p', L.p, R.p, base.p || {}), n: mergeKind('n', L.n, R.n, base.n || {}), f: mergeKind('f', L.f, R.f, base.f || {})
      };
      const cm = { p: canonMap('p', M.p), n: canonMap('n', M.n), f: canonMap('f', M.f) };
      const localChanged = !sameCanon(cm.p, canonMap('p', L.p)) || !sameCanon(cm.n, canonMap('n', L.n)) || !sameCanon(cm.f, canonMap('f', L.f));
      const remoteChanged = !rem.data || !sameCanon(cm.p, canonMap('p', R.p)) || !sameCanon(cm.n, canonMap('n', R.n)) || !sameCanon(cm.f, canonMap('f', R.f));
      if (localChanged) {
        if (editingNow()) { setSync('idle'); scheduleSync(4000); return; }
        S.projects = M.p; S.notes = M.n; S.meta.focus = Object.values(M.f);
        Object.values(S.projects).forEach(normalize); pruneFocus();
        UNDO.stack = []; UNDO.redo = [];
        lsWrite(); renderFn();
      }
      if (remoteChanged) {
        const payload = { app: 'fieldbook', version: 1, updatedAt: new Date().toISOString(), projects: Object.values(M.p), notes: Object.values(M.n), focus: Object.values(M.f) };
        try { await putRemote(payload, rem.sha); } catch (e) { if (e.conflict) continue; throw e; }
      }
      saveBase(cm); done = true;
    }
    if (!done) throw new Error('Sync conflict. It will retry shortly.');
    setSync('ok');
  } catch (e) {
    setSync('error', e && e.message ? e.message : 'Sync failed');
    if (/conflict/i.test(Sync.msg)) scheduleSync(8000);
  } finally {
    Sync.busy = false;
    if (Sync.again) { Sync.again = false; scheduleSync(1500); }
  }
}

function parseRepo(v) {
  const m = /^(?:https?:\/\/github\.com\/)?([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?$/i.exec(String(v || '').trim());
  return m ? m[1] + '/' + m[2] : '';
}
async function connectSync(cfg) {
  Sync.cfg = cfg;
  try {
    const r = await ghFetch('/repos/' + cfg.repo);
    if (r.status === 404) throw new Error('Repository not found, or the token has no access to it.');
    if (r.status === 401) throw new Error('GitHub rejected the token.');
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    const j = await r.json();
    if (!j.private) throw new Error('That repository is public, so anyone could read your data. Use a private repository.');
    if (j.permissions && !j.permissions.push) throw new Error('The token cannot write to this repository. Give it Contents: Read and write.');
  } catch (e) { Sync.cfg = null; throw e; }
  saveCfg(cfg); saveBase({});
  Sync.state = 'idle';
  await syncNow();
  if (Sync.state === 'error') { const m = Sync.msg; Sync.cfg = null; saveCfg(null); setSync('idle'); throw new Error(m); }
}
const linkCode = () => 'fbk1.' + b64enc(JSON.stringify({ repo: Sync.cfg.repo, token: Sync.cfg.token, path: Sync.cfg.path, branch: Sync.cfg.branch || '' }));
function decodeLink(code) {
  try {
    const c = JSON.parse(b64dec(String(code).trim().replace(/^fbk1\./, '')));
    if (c && parseRepo(c.repo) && typeof c.token === 'string' && c.token.length > 10) return { repo: parseRepo(c.repo), token: c.token, path: c.path || 'fieldbook-data.json', branch: c.branch || '' };
  } catch (e) {}
  return null;
}

function syncModal() {
  if (!syncAvailable()) {
    openModal(`<h2>Sync is on</h2><p>This copy keeps your data in your Claude account. Open the same page, signed in to Claude, on any other device and everything is there.</p><div class="actions"><button class="btn primary" data-act="close-modal">OK</button></div>`, '', 'sync');
    return;
  }
  if (Sync.cfg) {
    openModal(`<h2>Sync across devices</h2><p>Connected to <b>${esc(Sync.cfg.repo)}</b>. ${Sync.state === 'ok' ? 'Last synced ' + esc(ago(Sync.last)) + '.' : Sync.state === 'error' ? '' : 'Waiting for the first sync.'}</p>
      ${Sync.state === 'error' ? `<p class="form-err" style="margin-top:8px">${esc(Sync.msg)}</p>` : ''}
      <p class="hint" style="margin-top:12px">To link another device, open Settings → Sync across devices there and paste the link code. The code contains your token, so treat it like a password.</p>
      <div class="actions"><button class="btn danger sp" data-act="sync-disconnect">Disconnect this device</button><button class="btn" data-act="sync-copy">Copy link code</button><button class="btn primary" data-act="sync-now">Sync now</button></div>`, '', 'sync');
    return;
  }
  openModal(`<h2>Sync across devices</h2><p>Keeps projects and notes identical on your computer, iPad and phone by saving them to a private GitHub repository that only you can read.</p>
    <ol class="steps-help"><li>Create a new <b>private</b> repository on GitHub, for example <b>fieldbook-data</b>.</li>
    <li>Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">fine-grained token</a>. Under Repository access choose <b>Only select repositories</b> and pick that one. Under Permissions set <b>Contents</b> to <b>Read and write</b>.</li>
    <li>Paste both below. On your other devices, use the link code from this one.</li></ol>
    <form class="form" data-form="sync-connect" autocomplete="off">
      <div><label class="lab" for="sy-repo">Repository</label><input class="field" id="sy-repo" placeholder="your-name/fieldbook-data" data-first></div>
      <div><label class="lab" for="sy-token">Token</label><input class="field" id="sy-token" type="password" placeholder="github_pat_…" autocomplete="off"></div>
      <div class="form-err" id="sy-err" role="alert"></div>
      <div class="actions" style="margin-top:0"><button type="button" class="btn quiet" data-act="close-modal">Cancel</button><button class="btn primary" type="submit" id="sy-go">Connect</button></div>
    </form><hr>
    <form class="form" data-form="sync-code" autocomplete="off"><div><label class="lab" for="sy-code">Already linked another device? Paste its link code</label><input class="field" id="sy-code" placeholder="fbk1.…"></div>
      <div class="form-err" id="sy-err2" role="alert"></div><div class="actions" style="margin-top:0"><button class="btn" type="submit" id="sy-go2">Use link code</button></div></form>`, 'wide', 'sync');
}
async function runConnect(cfg, errId, btnId) {
  const err = $('#' + errId), btn = $('#' + btnId);
  err.textContent = ''; btn.disabled = true; const t = btn.textContent; btn.textContent = 'Connecting…';
  try { await connectSync(cfg); closeModal(); toast('Sync is on. Your data now follows you across devices.'); }
  catch (e) { err.textContent = e && e.message ? e.message : 'Could not connect.'; btn.disabled = false; btn.textContent = t; }
}
document.addEventListener('submit', e => {
  const f = e.target.closest && e.target.closest('[data-form]'); if (!f) return;
  if (f.dataset.form === 'sync-connect') {
    e.preventDefault();
    const repo = parseRepo($('#sy-repo').value), token = $('#sy-token').value.trim();
    if (!repo) { $('#sy-err').textContent = 'Enter the repository as your-name/repository-name.'; return; }
    if (token.length < 10) { $('#sy-err').textContent = 'Paste the token you created.'; return; }
    runConnect({ repo, token, path: 'fieldbook-data.json', branch: '' }, 'sy-err', 'sy-go');
  } else if (f.dataset.form === 'sync-code') {
    e.preventDefault();
    const cfg = decodeLink($('#sy-code').value);
    if (!cfg) { $('#sy-err2').textContent = 'That link code is not valid.'; return; }
    runConnect(cfg, 'sy-err2', 'sy-go2');
  }
});
A['sync-open'] = () => { closePop(); syncModal(); };
A['sync-now'] = () => { closeModal(); toast('Syncing…', { ms: 1500 }); syncNow(); };
A['sync-copy'] = () => {
  const code = linkCode();
  const done = () => toast('Link code copied. Paste it on your other device.');
  const fallback = () => openModal(`<h2>Link code</h2><p>Copy this and paste it on your other device.</p><textarea class="field code-box" id="exp-box" readonly style="margin-top:12px;height:110px">${esc(code)}</textarea><div class="actions"><button class="btn primary" data-act="close-modal">Close</button></div>`, '', 'code');
  try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
};
A['sync-disconnect'] = async () => {
  closeModal();
  const ok = await confirmBox({ title: 'Disconnect this device?', body: 'Your data stays on this device and in the repository. This device will stop syncing until you connect it again.', ok: 'Disconnect', danger: false });
  if (!ok) return; closeModal();
  Sync.cfg = null; saveCfg(null); setSync('idle'); toast('Sync turned off on this device.');
};
function initSync() {
  if (!syncAvailable()) return;
  Sync.cfg = loadCfg();
  if (!Sync.cfg) return;
  setSync('idle'); syncNow();
  setInterval(() => { if (Sync.cfg && document.visibilityState === 'visible') syncNow(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.cfg) syncNow(); });
  window.addEventListener('online', () => { if (Sync.cfg) syncNow(); });
  window.addEventListener('focusout', () => { if (Sync.cfg && Sync.again) scheduleSync(1000); });
}

})();
</script>
